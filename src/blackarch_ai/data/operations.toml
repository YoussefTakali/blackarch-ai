# Registered operations: the only commands the execution engine will run.
#
# Each operation renders to an argv list (never a shell string); parameter
# values are type-checked and can't inject arguments. Add your own operations
# here — including higher-impact ones — following the same shape. Set
# `permission` honestly: intrusive and high_impact always require approval.
#
#   [[operation]]
#   id = "unique_id"            # a-z, 0-9, _ or -
#   tool = "pkgname"            # must be installed (checked against the registry)
#   command = "binary"          # optional; defaults to tool
#   summary = "what it does"
#   permission = "passive|low|intrusive|high_impact"
#   args = ["-fixed", "-flags"]
#   timeout = 300
#   [[operation.params]]
#   name = "ports"; flag = "-p"; type = "string"; default = "top100"
#   [operation.target]
#   kind = "host|url|network|any"; flag = null; required = true

# ---------------------------------------------------------------- recon (low/passive)

[[operation]]
id = "dns-lookup"
tool = "bind"
command = "dig"
summary = "DNS records for a host (A/AAAA/MX/NS/TXT)."
permission = "low"
args = ["+nocmd", "+noall", "+answer"]
[[operation.params]]
name = "record_type"
type = "enum"
choices = ["A", "AAAA", "MX", "NS", "TXT", "CNAME", "SOA", "PTR", "ANY"]
default = "A"
description = "DNS record type"
[operation.target]
kind = "host"
required = true

[[operation]]
id = "whois"
tool = "whois"
summary = "WHOIS registration record for a domain or IP."
permission = "low"
[operation.target]
kind = "host"
required = true

# ---------------------------------------------------------------- network scanning

[[operation]]
id = "nmap-ping-sweep"
tool = "nmap"
summary = "Host discovery (ping sweep), no port scan."
permission = "low"
args = ["-sn", "-n", "-T4", "--min-rate", "1000", "--max-retries", "1", "-oN", "-"]
timeout = 600
[operation.target]
kind = "network"
required = true

[[operation]]
id = "nmap-service-scan"
tool = "nmap"
summary = "TCP service and version detection on selected ports."
permission = "intrusive"
args = ["-sV", "--open", "-oN", "-"]
timeout = 1800
[[operation.params]]
name = "ports"
flag = "-p"
type = "string"
default = "1-1000"
pattern = '^[0-9,\-]+$'
description = "Port list/range (e.g. 22,80,443 or 1-1000)"
[[operation.params]]
name = "timing"
flag = "-T"
type = "enum"
choices = ["0", "1", "2", "3", "4", "5"]
default = "3"
description = "nmap timing template"
[operation.target]
kind = "network"
required = true

[[operation]]
id = "nmap-tcp-connect"
tool = "nmap"
summary = "TCP connect scan (no raw sockets, no root needed)."
permission = "low"
args = ["-sT", "--open", "-oN", "-"]
timeout = 1200
[[operation.params]]
name = "ports"
flag = "-p"
type = "string"
default = "1-1000"
pattern = '^[0-9,\-]+$'
[operation.target]
kind = "network"
required = true

