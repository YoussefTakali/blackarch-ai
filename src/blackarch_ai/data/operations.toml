# ---------------------------------------------------------------- tls decryption
# HTTPS decryption via mitmproxy running as an explicit proxy (runs in the
# toolbox — no root/ARP needed). The target device must point its WiFi proxy at
# this host and trust the mitmproxy CA (~/.mitmproxy/mitmproxy-ca-cert.pem).
# Only decrypts apps/sites that do NOT pin their certificate.
[[operation]]
id = "mitm-proxy-decrypt"
tool = "mitmproxy"
command = "mitmdump"
unpackaged = true
summary = "Decrypt HTTPS via an explicit proxy (device must set proxy + trust the CA; no pinning)."
permission = "high_impact"
args = ["--flow-detail", "1", "--set", "termlog_verbosity=warn"]
timeout = 120
[[operation.params]]
name = "port"
flag = "--listen-port"
type = "int"
default = 8080
min = 1
max = 65535
description = "Proxy port the device connects to"
