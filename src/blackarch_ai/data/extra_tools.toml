# Security tools packaged by Arch Linux itself (not in any blackarch-* group),
# mapped to BlackArch categories so they reach the right agent.
# Only packages that are actually installed are added to the registry.
# Format: package = ["category", ...]

[packages]
exploitdb = ["exploitation"]
nmap = ["scanner", "networking"]
masscan = ["scanner"]
nikto = ["webapp", "scanner"]
sqlmap = ["webapp"]
gobuster = ["webapp", "fuzzer"]
wpscan = ["webapp", "scanner"]
zaproxy = ["webapp", "proxy"]
testssl-sh = ["crypto", "scanner"]
"testssl.sh" = ["crypto", "scanner"]
sslscan = ["crypto", "scanner"]
nbtscan = ["scanner", "windows"]
net-snmp = ["networking", "scanner"]
smbclient = ["networking", "windows"]
impacket = ["networking", "windows"]
wireshark-cli = ["sniffer"]
tcpdump = ["sniffer"]
bettercap = ["sniffer", "spoof"]
ettercap = ["sniffer", "spoof"]
openbsd-netcat = ["networking"]
socat = ["networking", "tunnel"]
mtr = ["networking"]
traceroute = ["networking"]
whois = ["recon"]
bind = ["recon"]
aircrack-ng = ["wireless"]
kismet = ["wireless"]
reaver = ["wireless"]
hydra = ["cracker"]
john = ["cracker"]
hashcat = ["cracker"]
metasploit = ["exploitation"]
radare2 = ["reversing", "disassembler"]
rizin = ["reversing", "disassembler"]
ghidra = ["reversing", "decompiler"]
gdb = ["debugger"]
binwalk = ["firmware"]
volatility3 = ["forensic"]
sleuthkit = ["forensic"]
foremost = ["forensic"]
yara = ["malware", "defensive"]
